{% extends "base.html" %}

{% block title %}Reset Password - BrightLoop{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow border-0">
      <div class="card-body p-4">
        <h4 class="card-title fw-bold text-center mb-1">Reset Password</h4>
        <p class="text-muted text-center small mb-4">
          Enter your registered email address and we will generate a password reset link.
        </p>

        {% include "includes/form_errors.html" %}

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_email" class="form-label fw-semibold">Email address</label>
            <input type="email" name="email" class="form-control" id="id_email" placeholder="name@example.com" required autofocus>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">Send Reset Instructions</button>
        </form>

        <div class="text-center mt-3">
          <a href="{% url 'accounts:login' %}" class="small text-decoration-none">&larr; Back to login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
